name: Generate app

# Assemble a new app from blocks of the periodic table (or numbered families), prove the assembly page is sound,
# raise a work order for everything that is missing, and commit it all with its report and recipe.
# Run from the Actions tab (or: gh workflow run generate.yml -f name=substation-finder -f blocks=Si,Vn,Ug,Ps,Dt).
on:
  workflow_dispatch:
    inputs:
      name:
        description: App name (lowercase letters, digits, hyphens)
        required: true
      blocks:
        description: Block symbols from the periodic table, comma-separated (e.g. Si,Vn,Ug)
        required: false
      families:
        description: Family numbers, comma-separated (from https://ventusltd.github.io/stars/code.html)
        required: false
      title:
        description: Title for the report (optional)
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate
        run: node generate.mjs --name "${{ inputs.name }}" --blocks "${{ inputs.blocks }}" --families "${{ inputs.families }}" --title "${{ inputs.title || inputs.name }}"

      - name: Prove the module parses and imports
        run: |
          set -e
          find apps/${{ inputs.name }} -name '*.mjs' -o -name '*.js' | while read f; do node --check "$f" || echo "parse problem: $f"; done
          if [ -f "apps/${{ inputs.name }}/${{ inputs.name }}.mjs" ]; then
            node -e "import('./apps/${{ inputs.name }}/${{ inputs.name }}.mjs').then(m => console.log(Object.keys(m).length + ' export(s) load'))"
          fi
          if [ -f "apps/${{ inputs.name }}/${{ inputs.name }}.py" ]; then python3 -c "import ast,sys; ast.parse(open('apps/${{ inputs.name }}/${{ inputs.name }}.py').read()); print('Python parses')"; fi

      # The assembly page must exist, its plan and inline script must parse, every planned file must be on disk,
      # and every name still needed must have a labelled input. A missing input fails the run; it is never skipped.
      - name: Check the assembly page
        run: node tools/check-assembly.mjs "apps/${{ inputs.name }}"

      # One GitHub issue per new work order, labelled work-order. A request that already records an issue, or whose
      # id is already in an issue title, is not raised again.
      - name: Raise work orders as issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls requests/${{ inputs.name }}-*.json >/dev/null 2>&1 || { echo "No work orders for ${{ inputs.name }}."; exit 0; }
          node tools/raise-work-orders.mjs requests/${{ inputs.name }}-*.json
          node generate.mjs --name "${{ inputs.name }}" --blocks "${{ inputs.blocks }}" --families "${{ inputs.families }}" --title "${{ inputs.title || inputs.name }}" >/dev/null

      - name: Commit
        if: always()
        run: |
          git add apps spider requests
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Generate ${{ inputs.name }} from ${{ inputs.blocks || inputs.families }}"
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep 7; done
          exit 1

      - name: Summary
        if: always()
        run: |
          [ -f "apps/${{ inputs.name }}/REPORT.md" ] && cat "apps/${{ inputs.name }}/REPORT.md" >> "$GITHUB_STEP_SUMMARY" || echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          [ -f "apps/${{ inputs.name }}/WORK-ORDERS.md" ] && cat "apps/${{ inputs.name }}/WORK-ORDERS.md" >> "$GITHUB_STEP_SUMMARY" || true
